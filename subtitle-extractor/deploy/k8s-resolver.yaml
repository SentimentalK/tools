apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-resolver
  namespace: ceo-system
  labels:
    app.kubernetes.io/name: content-resolver
    app.kubernetes.io/component: capability-service
    app.kubernetes.io/part-of: ceo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: content-resolver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-resolver
    spec:
      containers:
        - name: resolver
          image: ghcr.io/sentimentalk/content-resolver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TOOLS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tools-internal-secret
                  key: internal-token
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: content-resolver
  namespace: ceo-system
  labels:
    app.kubernetes.io/name: content-resolver
    app.kubernetes.io/component: capability-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: content-resolver
