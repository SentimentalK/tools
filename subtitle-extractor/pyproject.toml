[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-extractor"
version = "0.1.0"
description = "Capability package for content metadata resolution and speech transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
resolver = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
]
extractor = [
    "sherpa-onnx==1.13.7",
    "numpy>=1.24.0",
    "cryptography>=42.0.0",
    "secretstorage>=3.3.3",
]
all = [
    "subtitle-extractor[resolver,extractor]",
]
