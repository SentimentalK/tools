name: Content Resolver — Test & Publish Image

on:
  push:
    branches: [master]
    paths:
      - "url-resolver/**"
      - ".github/workflows/content-resolver-image.yaml"
  workflow_dispatch:

jobs:
  test-build-publish:
    name: Test, Build & Publish Content Resolver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & url-resolver
        run: |
          python -m pip install --upgrade pip
          pip install -e ./url-resolver

      - name: Run URL Resolver Test Suite Gate
        run: |
          python -m unittest discover -s url-resolver/tests -p "test_*.py" -v

      - name: CI Docker Smoke Build
        run: |
          docker build -t content-resolver:ci -f url-resolver/Dockerfile url-resolver

      - name: CI Real Container Smoke Test & Zero-Browser Binary Verification
        run: |
          docker run --rm -d --name smoke-resolver -p 8000:8000 -e TOOLS_INTERNAL_TOKEN=ci-smoke-token content-resolver:ci
          sleep 4
          
          echo "Testing /healthz..."
          curl -f -s http://localhost:8000/healthz | grep -q "ok"
          
          echo "Testing /readyz..."
          curl -f -s http://localhost:8000/readyz | grep -q "ready"

          echo "Testing real Weixin Channels resolve..."
          curl -f -s -X POST http://localhost:8000/v1/resolve \
            -H "Authorization: Bearer ci-smoke-token" \
            -H "Content-Type: application/json" \
            -d '{"schema_version": 1, "url": "https://weixin.qq.com/sph/AF17JEGHVd"}' | grep -q '"status":"resolved"'

          echo "Testing real YouTube resolve..."
          curl -f -s -X POST http://localhost:8000/v1/resolve \
            -H "Authorization: Bearer ci-smoke-token" \
            -H "Content-Type: application/json" \
            -d '{"schema_version": 1, "url": "https://www.youtube.com/watch?v=dQw4w9WgXcQ"}' | grep -q '"status":"resolved"'

          echo "Inspecting container image size and ensuring zero browser binaries..."
          docker images content-resolver:ci
          # Verify chromium binary is absent from container PATH
          docker exec smoke-resolver which chromium || echo "Verified: no chromium binary found."
          docker exec smoke-resolver which google-chrome || echo "Verified: no google-chrome binary found."

          docker stop smoke-resolver
          echo "Container smoke tests passed successfully!"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image tag
        run: |
          echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/content-resolver:latest" >> "$GITHUB_ENV"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./url-resolver
          file: ./url-resolver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAG }}
